name: captcha-solver

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      rounds:
        description: "live job 跑多少轮验证码"
        default: "3"
      min_pass:
        description: "live job 最低通过率 (0~1)"
        default: "0"

jobs:
  # ------------------------------------------------------------------
  # 离线回归: 不需要浏览器/网络, 用仓库里的 fixtures 验证定位准确率
  # fixtures 里的 errorCode=0 样本, 其 boxes 是腾讯官方确认过的正确位置
  # ------------------------------------------------------------------
  regression:
    name: 离线回归 (OpenCV 定位准确率)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 回归测试
        run: python captcha/ci_test.py

  # ------------------------------------------------------------------
  # 真跑: 在 xvfb 下启动 Chromium, 连腾讯云产品页, 端到端点验证码
  # 默认不跑(仅手动触发) —— CI 的出口 IP 容易被腾讯风控, 且属于对外发请求
  # ------------------------------------------------------------------
  live:
    name: 真跑腾讯云图形点选 (手动触发)
    needs: regression
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装系统依赖 (xvfb 提供虚拟显示)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libnss3 libatk1.0-0 libatk-bridge2.0-0 \
            libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 \
            libxrandr2 libgbm1 libasound2t64

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 在虚拟显示下端到端运行
        env:
          CAPTCHA_HEADLESS: "0"          # xvfb 下用有头模式, 避免被风控判定为 headless
          CAPTCHA_CDP: "http://127.0.0.1:9222"
        run: xvfb-run -a --server-args="-screen 0 1400x1000x24" python captcha/solve_run.py ${{ github.event.inputs.rounds }}

  # ------------------------------------------------------------------
  # 训练冒烟: 用临时目录里的数据跑一遍训练流程, 保证训练代码没坏
  # (需要真实采集数据才有意义; 没数据时跳过)
  # ------------------------------------------------------------------
  train-smoke:
    name: 训练流程冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 训练 (没有采集数据时跳过, 有数据时失败即红)
        run: |
          if compgen -G "/tmp/tencent-cap-dataset/*.npz" > /dev/null; then
            python captcha/train_svm.py
          else
            echo "没有采集数据, 跳过训练冒烟"
          fi
