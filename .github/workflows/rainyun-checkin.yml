name: rainyun-checkin

on:
  schedule:
    # UTC 04:00 = 北京时间 12:00
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      user:
        description: "雨云账号(留空则用 Secret)"
        default: ""
      pass:
        description: "雨云密码(留空则用 Secret)"
        default: ""
      rounds:
        description: "签到尝试轮数"
        default: "1"

jobs:
  # ------------------------------------------------------------------
  # 离线回归: 用仓库里的 fixtures 检查定位器没退化(不联网、不碰浏览器)
  # ------------------------------------------------------------------
  regression:
    name: 离线回归 (定位准确率)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 回归测试
        run: python captcha/ci_test.py

  # ------------------------------------------------------------------
  # 训练冒烟: 确认训练流程没坏(没有采集数据时跳过)
  # ------------------------------------------------------------------
  train-smoke:
    name: 训练流程冒烟
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 训练 (没有采集数据时跳过)
        run: |
          if compgen -G "/tmp/tencent-cap-dataset/*.npz" > /dev/null; then
            python captcha/train_svm.py
          else
            echo "没有采集数据, 跳过训练冒烟"
          fi

  # ------------------------------------------------------------------
  # 定时签到
  # ------------------------------------------------------------------
  checkin:
    name: 雨云每日签到
    needs: regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RAINYUN_USER: ${{ inputs.user || secrets.RAINYUN_USER }}
      RAINYUN_PASS: ${{ inputs.pass || secrets.RAINYUN_PASS }}
      HEADLESS: "false"          # xvfb 下用有头模式, 降低被风控概率
      DEBUG: "true"
      MAX_WORKERS: "2"
      CHECKIN_MAX_RETRIES: "2"
      CAPTCHA_TRIES: "4"
      NOTIFY_ONLY_FAILURE: "false"
      COOKIE_DIR: ${{ github.workspace }}/.rainyun-cookies
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 安装 xvfb (给有头模式提供虚拟显示)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: 缓存 Cookie
        uses: actions/cache@v4
        with:
          path: .rainyun-cookies
          key: rainyun-cookies-${{ github.run_id }}
          restore-keys: rainyun-cookies-

      - name: 执行签到
        run: xvfb-run -a --server-args="-screen 0 1440x900x24" python captcha/rainyun.py

      - name: 保存 Cookie
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .rainyun-cookies
          key: rainyun-cookies-latest-${{ github.run_id }}
